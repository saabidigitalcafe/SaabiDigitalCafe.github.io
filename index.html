<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saabi Digital Cafe – CSC, Varpal, Amritsar</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8ff;--ink:#0a1f4d;--card:#fff;--blue:#1565e8;--navy:#0a2a6b;--sun:#ffc21a;--mute:#4a5d86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07132e;--ink:#eaf1ff;--card:#0e2250;--mute:#a9bbe0}}
:root[data-theme="dark"]{--bg:#07132e;--ink:#eaf1ff;--card:#0e2250;--mute:#a9bbe0}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans','Segoe UI',system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.brand{font-family:'Baloo 2','Noto Sans',system-ui,sans-serif;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 5vw;background:var(--navy);color:#fff}
.brand{font-size:1.5rem;font-weight:800}.brand b{color:var(--sun)}
nav{display:flex;gap:16px;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;font-weight:600;font-size:.95rem}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.langs button{border:2px solid #ffffff55;background:transparent;color:#fff;border-radius:99px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.langs button.on{background:var(--sun);color:#0a1f4d;border-color:var(--sun);font-weight:700}
.hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:60px 5vw 80px;background:radial-gradient(circle at 80% 20%,#2f86ff55,transparent 50%),linear-gradient(135deg,#0a2a6b,#1565e8);color:#fff;perspective:1000px}
.hero h1{font-size:clamp(2.6rem,7vw,5.2rem);line-height:1;font-weight:800;text-shadow:0 6px 0 #0a2a6b,0 14px 24px #0008;transform:translateZ(0)}
.hero h1 span{color:var(--sun)}
.tag{display:inline-block;background:var(--sun);color:#0a1f4d;font-weight:800;padding:6px 18px;border-radius:8px;margin:18px 0;transform:skewX(-8deg)}
.hero p{font-size:1.15rem;max-width:34ch;margin:0 0 24px}
.btn{display:inline-block;position:relative;overflow:hidden;border:0;border-radius:12px;padding:14px 26px;font:700 1rem 'Baloo 2',sans-serif;text-decoration:none;cursor:pointer;color:#0a1f4d;background:var(--sun);box-shadow:0 6px 0 #c18f00;transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #c18f00}
.btn.alt{background:#fff;box-shadow:0 6px 0 #9db4e6;margin-inline-start:10px}
.stage{height:340px;display:grid;place-items:center;perspective:900px}
.scene{width:170px;height:170px;position:relative;transform-style:preserve-3d;animation:spin 14s linear infinite;transition:transform .3s}
.scene.fast{animation-duration:1.2s}
.face{position:absolute;inset:0;display:grid;place-items:center;font-size:4.2rem;background:#ffffff22;border:2px solid #ffffff88;border-radius:18px;backdrop-filter:blur(4px);box-shadow:inset 0 0 30px #ffffff44}
.face:nth-child(1){transform:translateZ(85px)}.face:nth-child(2){transform:rotateY(90deg) translateZ(85px)}.face:nth-child(3){transform:rotateY(180deg) translateZ(85px)}.face:nth-child(4){transform:rotateY(-90deg) translateZ(85px)}.face:nth-child(5){transform:rotateX(90deg) translateZ(85px)}.face:nth-child(6){transform:rotateX(-90deg) translateZ(85px)}
@keyframes spin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
section{padding:70px 5vw}
h2{font-size:clamp(1.9rem,4vw,2.8rem);text-align:center;margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px;perspective:1000px}
.card{background:var(--card);border-radius:20px;padding:26px 18px;text-align:center;box-shadow:0 10px 28px #0a2a6b22;transform-style:preserve-3d;transition:transform .15s ease-out;cursor:pointer;position:relative;overflow:hidden}
.card .ic{width:76px;height:76px;margin:0 auto 12px;border-radius:22px;display:grid;place-items:center;font-size:2.3rem;transform:translateZ(40px);box-shadow:0 12px 18px #0003}
.card h3{font-size:1.1rem;transform:translateZ(24px)}
.card.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(.93) rotate(-2deg)}70%{transform:scale(1.06) rotate(2deg)}}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;max-width:1000px;margin:auto}
.photos svg{width:100%;height:auto;border-radius:20px;box-shadow:0 10px 28px #0a2a6b33;background:#dcebff}
.loc{display:grid;grid-template-columns:1fr 1fr;gap:26px;max-width:1000px;margin:auto;align-items:stretch}
.map{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 28px #0a2a6b33;min-height:280px;background:#cfe3ff}
.map svg{width:100%;height:100%;display:block}
.pin{animation:bob 1.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-12px)}}
.info{background:var(--card);border-radius:22px;padding:28px;box-shadow:0 10px 28px #0a2a6b22;display:flex;flex-direction:column;gap:14px;justify-content:center}
.info p{margin:0;color:var(--mute);font-size:1.05rem}.info .num{font-size:1.5rem;font-weight:800;font-family:'Baloo 2',sans-serif}
footer{background:var(--navy);color:#fff;text-align:center;padding:26px 5vw calc(26px + env(safe-area-inset-bottom,0px))}
.wa{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:#25d366;color:#fff;border-radius:99px;padding:13px 18px;font:700 1rem 'Baloo 2',sans-serif;text-decoration:none;box-shadow:0 8px 20px #0005}
.rip{position:absolute;border-radius:50%;background:#ffffffaa;transform:scale(0);animation:rip .6s linear forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.bit{position:fixed;z-index:99;width:10px;height:10px;border-radius:3px;pointer-events:none}
.rv{opacity:0;transform:translateY(30px) rotateX(-12deg);transition:all .7s}.rv.in{opacity:1;transform:none}
@media(max-width:800px){.hero,.loc{grid-template-columns:1fr}.stage{height:260px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* ===== ENHANCEMENTS ===== */
#prog{position:fixed;top:0;left:0;height:4px;width:0;z-index:60;background:linear-gradient(90deg,var(--sun),#ff8a1f,#e0238c,#7b3fe4,var(--blue));box-shadow:0 0 10px var(--sun)}
header{transition:padding .3s,box-shadow .3s;background:linear-gradient(90deg,#0a2a6b,#123f9c,#0a2a6b);background-size:200% 100%;animation:hg 8s linear infinite}
header.sm{padding-top:4px;padding-bottom:4px;box-shadow:0 8px 24px #0006}
@keyframes hg{to{background-position:-200% 0}}
nav a{position:relative}nav a:after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:3px;background:var(--sun);border-radius:3px;transform:scaleX(0);transition:transform .25s}nav a:hover:after,nav a.act:after{transform:scaleX(1)}
#th{border:2px solid #ffffff55;background:transparent;color:#fff;border-radius:99px;padding:4px 10px;cursor:pointer;font-size:1rem}
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#0a2a6b,#1565e8);display:grid;place-items:center;color:#fff;text-align:center;transition:opacity .6s,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
#splash b{display:block;font:800 clamp(2rem,8vw,4rem) 'Baloo 2',sans-serif;animation:zoom 1s both}#splash b span{color:var(--sun)}
#splash i{display:block;width:min(260px,60vw);height:6px;border-radius:6px;background:#ffffff33;margin:18px auto 0;overflow:hidden}
#splash i:after{content:"";display:block;height:100%;background:var(--sun);animation:ld 1.1s ease-out forwards}
@keyframes ld{from{width:0}to{width:100%}}@keyframes zoom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#hc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.hero>div{position:relative;z-index:1}
.status{display:inline-flex;align-items:center;gap:8px;background:#ffffff1f;border:1px solid #ffffff55;border-radius:99px;padding:6px 16px;font-weight:700;margin-bottom:16px;backdrop-filter:blur(6px)}
.status i{width:10px;height:10px;border-radius:50%;background:#2ee36b;animation:pl 1.6s infinite}
.status.c i{background:#ff5252;animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 #2ee36bcc}70%,100%{box-shadow:0 0 0 10px #2ee36b00}}
.type{font:700 1.3rem 'Baloo 2',sans-serif;min-height:2em;margin:0 0 22px;color:var(--sun)}
.type:after{content:"|";animation:bl .8s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.stage{position:relative;transition:transform .2s ease-out}
.stage:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:conic-gradient(var(--sun),#e0238c,#7b3fe4,#2e9d4f,var(--sun));filter:blur(40px);opacity:.45;animation:spinz 8s linear infinite}
@keyframes spinz{to{transform:rotate(360deg)}}
.mq{direction:ltr;overflow:hidden;background:var(--sun);color:#0a1f4d;padding:12px 0;transform:rotate(-1.2deg);margin:18px -2vw;white-space:nowrap}
.mq div{display:inline-block;animation:mq 45s linear infinite;font:800 1.3rem 'Baloo 2',sans-serif}
.mq span{margin:0 22px}.mq span:after{content:"★";margin-left:44px;color:#e0238c}
@keyframes mq{to{transform:translateX(-50%)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px;padding:40px 5vw 10px;max-width:1100px;margin:auto}
.stat{background:var(--card);border-radius:20px;padding:22px;text-align:center;box-shadow:0 10px 28px #0a2a6b22;border-bottom:5px solid var(--sun)}
.stat b{display:block;font:800 3rem 'Baloo 2',sans-serif;color:var(--blue)}.stat span{color:var(--mute);font-weight:600}
.rv{transition-delay:var(--d,0s)}
.card.done{transition:transform .15s ease-out;transition-delay:0s}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff66 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s;pointer-events:none}.card:hover:before{transform:translateX(120%)}
.card .ic{animation:wob 3s ease-in-out infinite}.card:nth-child(2n) .ic{animation-delay:-1s}.card:nth-child(3n) .ic{animation-delay:-2s}
@keyframes wob{50%{transform:translateZ(40px) translateY(-6px) rotate(5deg)}}
.ask{display:inline-block;margin-top:10px;font-size:.85rem;font-weight:700;color:#128c4a;text-decoration:none}.ask:hover{text-decoration:underline}
h2:after{content:"";display:block;width:70px;height:6px;border-radius:6px;background:var(--sun);margin:10px auto 0;animation:uw 2.5s ease-in-out infinite}@keyframes uw{50%{width:140px}}
.photos svg{transition:transform .4s,box-shadow .4s;cursor:zoom-in;animation:fl 6s ease-in-out infinite}
.photos svg:nth-child(2){animation-delay:-2s}.photos svg:nth-child(3){animation-delay:-4s}
.photos svg:hover{animation:none;transform:scale(1.05) rotate(-1.5deg);box-shadow:0 20px 40px #0a2a6b55}
@keyframes fl{50%{transform:translateY(-8px)}}
#lb{position:fixed;inset:0;z-index:90;background:#000c;display:grid;place-items:center;opacity:0;visibility:hidden;transition:.3s;padding:5vw;cursor:zoom-out}
#lb.on{opacity:1;visibility:visible}#lb svg{width:min(900px,92vw);height:auto;max-height:80vh;border-radius:20px;animation:zoom .4s}
.map g[stroke-dasharray] path{animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-36}}
.ring{fill:none;stroke:#e53935;stroke-width:3;transform-origin:200px 150px;animation:rg 2s ease-out infinite}.ring.b{animation-delay:-1s}
@keyframes rg{from{transform:scale(.2);opacity:.9}to{transform:scale(3);opacity:0}}
.wa{animation:wp 2s infinite}@keyframes wp{0%{box-shadow:0 0 0 0 #25d36699}70%,100%{box-shadow:0 0 0 18px #25d36600}}
.tr{position:fixed;width:12px;height:12px;border-radius:50%;pointer-events:none;z-index:98;background:radial-gradient(#ffc21a,#ffc21a00)}

/* ===== SILVER + GOLD BACKGROUND ===== */
:root{--gal:#ffffffb3}
body{background:linear-gradient(120deg,#eceef2,#cfd3da 20%,#f6e7b4 42%,#d9b24a 60%,#eef0f4 80%,#c7ccd4);background-size:300% 300%;background-attachment:fixed;animation:sg 14s ease-in-out infinite}
@keyframes sg{50%{background-position:100% 50%}}
#gallery{background:linear-gradient(135deg,var(--gal),#fff3c8aa)!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#25252b;--ink:#f6efd8;--mute:#cfc6a8;--gal:#25252bcc}:root:not([data-theme="light"]) body{background:linear-gradient(120deg,#17171b,#34343c 25%,#6b5416 55%,#2b2b32 80%,#8a6d1f);background-size:300% 300%;background-attachment:fixed}}
:root[data-theme="dark"]{--card:#25252b;--ink:#f6efd8;--mute:#cfc6a8;--gal:#25252bcc}
:root[data-theme="dark"] body{background:linear-gradient(120deg,#17171b,#34343c 25%,#6b5416 55%,#2b2b32 80%,#8a6d1f);background-size:300% 300%;background-attachment:fixed}

/* ===== HELPER BOT ===== */
#bb{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#1565e8,#7b3fe4);color:#fff;font-size:1.7rem;cursor:pointer;box-shadow:0 8px 20px #0006;animation:bp 2.4s infinite}
@keyframes bp{0%{box-shadow:0 0 0 0 #1565e8aa}70%,100%{box-shadow:0 0 0 16px #1565e800}}
#bp{position:fixed;inset-inline-start:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:31;width:min(360px,92vw);height:min(500px,68vh);display:flex;flex-direction:column;background:var(--card);color:var(--ink);border-radius:20px;box-shadow:0 20px 50px #0007;overflow:hidden;transform:translateY(20px) scale(.9);opacity:0;visibility:hidden;transition:.25s;transform-origin:bottom left}
#bp.on{transform:none;opacity:1;visibility:visible}
#bh{background:linear-gradient(90deg,#0a2a6b,#1565e8);color:#fff;padding:12px 16px;font:800 1.1rem 'Baloo 2',sans-serif;display:flex;justify-content:space-between;align-items:center}
#bh button{background:none;border:0;color:#fff;font-size:1.3rem;cursor:pointer}
#bl{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bm{max-width:88%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;font-size:.92rem;line-height:1.45;animation:zoom .25s}
.bm.b{background:#e9f0ff;color:#0a1f4d;align-self:flex-start;border-end-start-radius:4px}
.bm.u{background:var(--blue);color:#fff;align-self:flex-end;border-end-end-radius:4px}
.bm.t:after{content:"● ● ●";letter-spacing:2px;animation:bl .9s steps(1) infinite}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts a,.acts button,#bc button{border:2px solid var(--blue);background:#fff;color:#0a2a6b;border-radius:99px;padding:5px 12px;font:700 .8rem 'Noto Sans',sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.acts a:hover,.acts button:hover,#bc button:hover{background:var(--sun);border-color:var(--sun)}
#bc{display:flex;gap:6px;overflow-x:auto;padding:6px 10px}
#bf{display:flex;gap:6px;padding:10px;border-top:1px solid #0002}
#bf input{flex:1;min-width:0;border:2px solid #9db4e6;border-radius:99px;padding:8px 14px;font:inherit;background:var(--bg);color:var(--ink)}
#bf button{border:0;background:var(--sun);color:#0a1f4d;border-radius:99px;padding:0 16px;font-weight:800;cursor:pointer}
/* ===== MERGED FROM index.html ===== */
.hero{overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.5;animation:fl2 9s ease-in-out infinite}
.hero::before{width:260px;height:260px;background:#ffc21a;left:-60px;top:20%}.hero::after{width:300px;height:300px;background:#00d4ff;right:5%;bottom:-100px;animation-delay:-4s}
@keyframes fl2{50%{transform:translate(40px,-30px) scale(1.2)}}
.srch{display:block;margin:-10px auto 28px;width:min(420px,90%);padding:13px 20px;border-radius:99px;border:2px solid var(--blue);background:var(--card);color:var(--ink);font:inherit;font-size:1rem}
.trust{display:grid;grid-template-columns:320px 1fr;gap:40px;max-width:980px;margin:auto;align-items:center;perspective:1200px}
.flip{height:380px;cursor:pointer;perspective:1200px}
.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.flip.on .fi{transform:rotateY(180deg)}
.ff{-webkit-backface-visibility:hidden;position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;padding:22px;text-align:center;background:linear-gradient(160deg,#0a2a6b,#1565e8);color:#fff;box-shadow:0 20px 40px #0a2a6b55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:3px solid var(--sun)}
.ff img{width:170px;height:180px;object-fit:cover;border-radius:18px;border:4px solid #fff;box-shadow:0 10px 24px #0006}
.ff.back{transform:rotateY(180deg)}.ff .k{margin:6px 0 0;font-size:.8rem;opacity:.8}.ff h3{font-size:1.5rem}.ff p{margin:0}
.chk{display:flex;gap:10px;margin:12px 0;font-weight:600}.chk::before{content:"\2714";color:#fff;background:#2e9d4f;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;flex:none;font-size:.85rem}
.hint{color:var(--mute);font-size:.9rem}
@media(max-width:800px){.trust{grid-template-columns:1fr}.flip{max-width:320px;margin:auto;width:100%}}
.proofs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;max-width:1100px;margin:auto;perspective:1000px}
.pf{margin:0;background:var(--card);border-radius:18px;padding:12px;box-shadow:0 12px 30px #0a2a6b33;transition:transform .3s;cursor:zoom-in}
.pf:hover{transform:translateY(-8px) rotateX(4deg)}
.pf img{width:100%;height:auto;border-radius:10px;display:block}
.pf figcaption{text-align:center;font-weight:700;padding:10px 4px 2px;font-family:'Baloo 2',sans-serif}
.pill{display:inline-block;margin-inline-start:6px;padding:2px 12px;border-radius:99px;background:#2e9d4f;color:#fff;font-size:.85rem;animation:pu 1.6s infinite}.pill.off{background:#d33}.pill[hidden]{display:none}@keyframes pu{50%{opacity:.6}}
.photos .wide{grid-column:1/-1}
.photos .pf{animation:fl 6s ease-in-out infinite}.photos .pf:nth-child(2){animation-delay:-2s}.photos .pf:nth-child(3){animation-delay:-4s}.photos .pf:hover{animation:none}
#lb img{max-width:min(900px,92vw);max-height:80vh;border-radius:12px;box-shadow:0 20px 60px #000;animation:zoom .4s}

</style>
</head>
<body>
<div id="splash"><div><b>Saabi <span>Digital</span> Cafe</b><i></i></div></div><div id="prog"></div><div id="lb"></div>
<header>
  <div class="brand">Saabi <b>Digital</b> Cafe</div>
  <nav><a href="#home" data-t="nHome"></a><a href="#services" data-t="nSvc"></a><a href="#trust" data-t="nTrust"></a><a href="#proof" data-t="nProof"></a><a href="#visit" data-t="nLoc"></a></nav>
  <div class="langs" id="langs" role="group" aria-label="Language"></div>
  <button id="th" aria-label="Toggle light and dark theme">🌓</button>
</header>

<div class="hero" id="home">
  <div>
    <div class="status" id="st"></div><h1>SAABI<br><span>DIGITAL CAFE</span></h1>
    <div class="tag" data-t="tag"></div>
    <p data-t="sub"></p>
    <div class="type" id="tw"></div>
    <a class="btn" href="tel:+917888713684" data-t="call"></a>
    <a class="btn alt" href="#visit" data-t="dir"></a>
  </div>
  <div class="stage"><div class="scene" id="cube">
    <div class="face">🖨️</div><div class="face">📄</div><div class="face">🪪</div><div class="face">🏛️</div><div class="face">🗳️</div><div class="face">🛂</div>
  </div></div>
</div>

<div class="mq"><div id="mqi"></div></div>
<div class="stats">
  <div class="stat rv"><b data-n="11">0</b><span data-t="nSvc"></span></div>
  <div class="stat rv"><b data-n="5">0</b><span data-t="lg"></span></div>
  <div class="stat rv"><b data-n="7">0</b><span data-t="dy"></span></div>
  <div class="stat rv"><b data-n="10">0</b><span data-t="hr"></span></div>
</div>
<section id="services">
  <h2 data-t="svcT"></h2>
  <input class="srch" id="srch" data-ph="ph" type="search">
  <div class="grid" id="svcGrid"></div>
</section>

<section id="trust">
  <h2 data-t="trustT"></h2>

const KW={hours:/time|timing|open|close|hour|khul|kab\b|समय|खुल|बंद|ਸਮਾਂ|ਖੁੱਲ|ਕਦੋਂ|وقت|کھل|সময়|খোলা/i,loc:/where|address|location|map|direction|route|kahan|पता|कहाँ|रास्ता|ਪਤਾ|ਕਿੱਥੇ|ਰਸਤਾ|پتہ|کہاں|راستہ|ঠিকানা|কোথায়/i,phone:/call|phone|number|whatsapp|contact|फोन|कॉल|नंबर|ਫ਼ੋਨ|ਕਾਲ|ਨੰਬਰ|فون|کال|نمبر|ফোন|কল|নম্বর/i,price:/price|fee|charge|cost|rate|how much|कीमत|शुल्क|फीस|रेट|ਕੀਮਤ|ਫੀਸ|ਰੇਟ|فیس|قیمت|ریٹ|দাম|ফি/i,docs:/document|doc\b|docs|paper|need|require|kagaz|कागज|दस्तावेज|ज़रूरी|ਦਸਤਾਵੇਜ਼|ਕਾਗਜ਼|ਲੋੜ|دستاویز|کاغذ|ضرورت|নথি|কাগজ|প্রয়োজন/i,svc:/service|offer|list|सेवा|ਸੇਵਾ|خدمات|পরিষেবা/i,hi:/^\s*(hi|hello|hey|namaste|sat sri akal|नमस्ते|ਸਤ ਸ੍ਰੀ ਅਕਾਲ|سلام|হ্যালো)/i};
function docsFor(i){const d=SD[i];if(!d)return T(B.nod);return T(B.intro).replace('{s}',D['s'+(i+1)][cur])+'\n• '+d.map(k=>T(DOC[k])).join('\n• ')+'\n\n'+T(B.conf)}
const CALL=()=>[[D.call[cur],TEL],['WhatsApp',WA]];
function run(n,k){switch(n){
case'hi':return[T(B.greet)];case'hours':return[T(B.hours)];case'loc':return[D.addr[cur],[[D.open[cur],MAPS]]];
case'phone':return[T(B.phone),CALL()];case'price':return[T(B.price),CALL()];
case'svc':return[ICONS.map((x,i)=>x[0]+' '+D['s'+(i+1)][cur]).join('\n')];
case'docs':return k==null?[T(B.askd),null,1]:[docsFor(k)];
default:return[T(B.fb),CALL()]}}
function ask(q){const k=ORD.find(i=>SV[i].test(q));
if(KW.price.test(q))return['price'];if(KW.hours.test(q))return['hours'];if(k!==undefined)return['docs',k];
if(KW.loc.test(q))return['loc'];if(KW.phone.test(q))return['phone'];if(KW.docs.test(q))return['docs'];if(KW.svc.test(q))return['svc'];if(KW.hi.test(q))return['hi'];return['x']}
// UI
const bb=document.createElement('button');bb.id='bb';bb.textContent='🤖';bb.setAttribute('aria-label','Helper chat');
const bp=document.createElement('div');bp.id='bp';bp.setAttribute('role','dialog');
bp.innerHTML='<div id="bh"><span id="bt"></span><button id="bx" aria-label="Close">✕</button></div><div id="bl" aria-live="polite"></div><div id="bc"></div><form id="bf"><input id="bi" autocomplete="off"><button id="bs"></button></form>';
document.body.append(bb,bp);
const bl=$('bl');
function add(t,who,acts,svc){const d=document.createElement('div');d.className='bm '+who;d.textContent=t;
if(acts||svc){const a=document.createElement('div');a.className='acts';
(acts||[]).forEach(([l,h])=>{const x=document.createElement('a');x.textContent=l;x.href=h;if(h.startsWith('http'))x.target='_blank';x.rel='noopener';a.appendChild(x)});
if(svc)ICONS.forEach((c,i)=>{const x=document.createElement('button');x.type='button';x.textContent=c[0]+' '+D['s'+(i+1)][cur];x.onclick=()=>say(x.textContent,['docs',i]);a.appendChild(x)});
d.appendChild(a)}
bl.appendChild(d);bl.scrollTop=bl.scrollHeight;return d}
function say(label,intent){if(label)add(label,'u');const t=add('','b t');setTimeout(()=>{t.remove();const r=run(intent[0],intent[1]);add(r[0],'b',r[1],r[2])},550)}
function chips(){const c=$('bc');c.innerHTML='';[[D.nSvc,'svc'],[B.cDocs,'docs'],[B.cTime,'hours'],[D.nLoc,'loc'],[D.call,'phone']].forEach(([l,n])=>{const b=document.createElement('button');b.type='button';b.textContent=T(l);b.onclick=()=>say(T(l),[n]);c.appendChild(b)})}
function lang(){$('bt').textContent='🤖 '+T(B.title);$('bi').placeholder=T(B.ph);$('bs').textContent=T(B.send);chips()}
let first=1;function toggle(on){bp.classList.toggle('on',on);if(on){if(first){first=0;add(T(B.greet),'b')}$('bi').focus()}}
bb.onclick=()=>toggle(!bp.classList.contains('on'));$('bx').onclick=()=>toggle(false);
addEventListener('keydown',e=>{if(e.key==='Escape')toggle(false)});
$('bf').onsubmit=e=>{e.preventDefault();const q=$('bi').value.trim();if(!q)return;$('bi').value='';say(q,ask(q))};
const o2=window.setLang;window.setLang=function(i){o2(i);lang()};lang();
})();

// ===== MERGED FROM index.html: flip card, service search, photo/document lightbox, live open pill =====
(()=>{
const $=id=>document.getElementById(id);
const fl=$('flip');fl.onclick=()=>fl.classList.toggle('on');fl.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fl.click()}};
$('srch').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('#svcGrid .card').forEach(c=>{c.style.display=c.querySelector('h3').textContent.toLowerCase().includes(q)?'':'none'})};
const lb=$('lb');document.querySelectorAll('.pf').forEach(f=>f.addEventListener('click',()=>{lb.innerHTML='';const im=f.querySelector('img').cloneNode();im.removeAttribute('loading');lb.appendChild(im);lb.classList.add('on')}));
function openNow(){let h=10;try{h=+new Intl.DateTimeFormat('en-GB',{hour:'numeric',hourCycle:'h23',timeZone:'Asia/Kolkata'}).format(new Date())}catch(e){h=new Date().getHours()}const o=h>=10&&h<20;$('pOn').hidden=!o;$('pOff').hidden=o}
openNow();setInterval(openNow,60000);
})();
</script>
